# Optional overlay: mounts the server's one credential sink into the backend.
# Used by scripts/server/accept_self_hosted.sh when WORKCHORD_CREDENTIAL_SINK_HOST_DIR
# is set; the directory must already exist with mode 0700.
services:
  backend:
    environment:
      AGENT_TEAM_CREDENTIAL_SINK_DIR: /run/workchord/credential-sink
    volumes:
      - type: bind
        source: ${WORKCHORD_CREDENTIAL_SINK_HOST_DIR:?Set WORKCHORD_CREDENTIAL_SINK_HOST_DIR}
        target: /run/workchord/credential-sink

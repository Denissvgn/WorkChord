name: workchord

services:
  migration:
    build:
      context: .
      dockerfile: Dockerfile.backend
    volumes:
      - workchord_data:/app/data
    environment:
      - DATABASE_URL=sqlite+aiosqlite:////app/data/workchord.db
      - DATABASE_PROCESS_ROLE=migration
      - DATABASE_POOL_SIZE=1
      - DATABASE_MAX_OVERFLOW=0
      - DEPLOYMENT_ENVIRONMENT=development
      - MAINTENANCE_MODE=off
      - OUTBOUND_DELIVERY_WORKER_ENABLED=false
    command: ["python", "-m", "app.cli.upgrade", "--no-repairs"]
    networks:
      - workchord
    restart: "no"

  repair:
    build:
      context: .
      dockerfile: Dockerfile.backend
    volumes:
      - workchord_data:/app/data
    environment:
      - DATABASE_URL=sqlite+aiosqlite:////app/data/workchord.db
      - DATABASE_PROCESS_ROLE=repair
      - DATABASE_POOL_SIZE=1
      - DATABASE_MAX_OVERFLOW=0
      - DEPLOYMENT_ENVIRONMENT=development
      - MAINTENANCE_MODE=off
      - OUTBOUND_DELIVERY_WORKER_ENABLED=false
    command: ["python", "-m", "app.cli.upgrade", "--repairs-only"]
    depends_on:
      migration:
        condition: service_completed_successfully
    networks:
      - workchord
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    expose:
      - "8001"
    volumes:
      - workchord_data:/app/data
    environment:
      - DATABASE_URL=sqlite+aiosqlite:////app/data/workchord.db
      - DATABASE_PROCESS_ROLE=web
      - API_PREFIX=/api
      - DEBUG=false
      - CORS_ORIGINS=["http://localhost","http://frontend"]
      - SETTINGS_ENCRYPTION_KEY=${SETTINGS_ENCRYPTION_KEY:-}
      - AGENT_BOOTSTRAP_API_KEY=${AGENT_BOOTSTRAP_API_KEY:-}
      - AGENT_SKILL_BUNDLES_PUBLIC=${AGENT_SKILL_BUNDLES_PUBLIC:-false}
      - AGENT_SKILL_BUNDLE_TRUSTED_CHECKSUMS_SHA256=${AGENT_SKILL_BUNDLE_TRUSTED_CHECKSUMS_SHA256:-}
      - WORKCHORD_ADMIN_API_KEY=${WORKCHORD_ADMIN_API_KEY:-}
      - ALLOW_PRIVATE_EGRESS_URLS=${ALLOW_PRIVATE_EGRESS_URLS:-false}
      - TRUSTED_PROXY_IPS=${TRUSTED_PROXY_IPS:-[]}
      - SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-false}
      - SESSION_MAX_AGE_SECONDS=${SESSION_MAX_AGE_SECONDS:-2592000}
      - SESSION_TOUCH_INTERVAL_SECONDS=${SESSION_TOUCH_INTERVAL_SECONDS:-300}
      - AGENT_LAST_SEEN_INTERVAL_SECONDS=${AGENT_LAST_SEEN_INTERVAL_SECONDS:-300}
      - NOTIFICATIONS_ENABLED=${NOTIFICATIONS_ENABLED:-false}
      - OUTBOUND_DELIVERY_WORKER_ENABLED=false
      - OUTBOUND_DELIVERY_POLL_SECONDS=${OUTBOUND_DELIVERY_POLL_SECONDS:-1}
      - OUTBOUND_DELIVERY_BATCH_SIZE=${OUTBOUND_DELIVERY_BATCH_SIZE:-50}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM_EMAIL=${SMTP_FROM_EMAIL:-notifications@workchord.local}
      - SMTP_USE_TLS=${SMTP_USE_TLS:-true}
      - MAINTENANCE_MODE=${MAINTENANCE_MODE:-off}
      - MAINTENANCE_REVISION=${MAINTENANCE_REVISION:-development}
      - MAINTENANCE_REPLICA_ID=${MAINTENANCE_REPLICA_ID:-backend-local}
      - MAINTENANCE_RETRY_AFTER_SECONDS=${MAINTENANCE_RETRY_AFTER_SECONDS:-60}
      - MAINTENANCE_VALIDATION_ALLOWLIST=${MAINTENANCE_VALIDATION_ALLOWLIST:-["/health","/health/live","/health/ready","/metrics"]}
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8001"]
    depends_on:
      repair:
        condition: service_completed_successfully
    networks:
      - workchord
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health/ready')" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  delivery-worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    volumes:
      - workchord_data:/app/data
    environment:
      - DATABASE_URL=sqlite+aiosqlite:////app/data/workchord.db
      - DATABASE_PROCESS_ROLE=delivery_worker
      - DATABASE_POOL_SIZE=8
      - DATABASE_MAX_OVERFLOW=2
      - DEPLOYMENT_ENVIRONMENT=development
      - OUTBOUND_DELIVERY_WORKER_ENABLED=true
      - OUTBOUND_DELIVERY_POLL_SECONDS=${OUTBOUND_DELIVERY_POLL_SECONDS:-1}
      - OUTBOUND_DELIVERY_BATCH_SIZE=${OUTBOUND_DELIVERY_BATCH_SIZE:-50}
      - MAINTENANCE_MODE=${MAINTENANCE_MODE:-off}
      - MAINTENANCE_REVISION=${MAINTENANCE_REVISION:-development}
      - MAINTENANCE_REPLICA_ID=${MAINTENANCE_REPLICA_ID:-delivery-worker-local}
      - NOTIFICATIONS_ENABLED=${NOTIFICATIONS_ENABLED:-false}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM_EMAIL=${SMTP_FROM_EMAIL:-notifications@workchord.local}
      - SMTP_USE_TLS=${SMTP_USE_TLS:-true}
    command: ["python", "-m", "app.cli.worker"]
    depends_on:
      repair:
        condition: service_completed_successfully
    networks:
      - workchord
    restart: "on-failure:5"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - workchord
    restart: unless-stopped

networks:
  workchord:
    driver: bridge
    internal: false

volumes:
  workchord_data:

name: Deployment acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deployment-acceptance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  server-acceptance:
    name: Self-hosted server acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Prepare public receipt validators
        run: |
          python -m venv .runtime/acceptance-export-venv
          .runtime/acceptance-export-venv/bin/pip install --require-hashes -r backend/requirements.lock
      - name: Build and accept the self-hosted stack
        id: acceptance
        run: |
          ./scripts/server/accept_self_hosted.sh
          ./scripts/server/accept_self_hosted.sh
      - name: Validate the bounded receipt
        id: receipt
        run: |
          test -s .runtime/autonomy/reports/latest.json
          test -s .runtime/autonomy/reports/trusted-signer-public-key.b64
          test "$(find .runtime/autonomy/reports \
            -maxdepth 1 -name 'previous-*.json' | wc -l)" -ge 1
          grep -q '"decision": "SELF-HOSTED-SERVER-ACCEPTED"' \
            .runtime/autonomy/reports/latest.json
          grep -q '"accepted_as_production_evidence": false' \
            .runtime/autonomy/reports/latest.json
      - name: Export bounded public evidence
        if: always()
        env:
          ACCEPTANCE_OUTCOME: ${{ steps.acceptance.outcome == 'success' && steps.receipt.outcome == 'success' && 'success' || 'failure' }}
        run: |
          exporter=python3
          if test -x .runtime/acceptance-export-venv/bin/python; then
            exporter=.runtime/acceptance-export-venv/bin/python
          fi
          "$exporter" scripts/server/export_acceptance_artifacts.py \
            --reports .runtime/autonomy/reports \
            --output .runtime/autonomy/reports/public-artifacts \
            --outcome "$ACCEPTANCE_OUTCOME"
      - name: Retain public acceptance evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: self-hosted-acceptance-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: error
          path: |
            .runtime/autonomy/reports/public-artifacts/*.json
            .runtime/autonomy/reports/public-artifacts/*.b64
      - name: Stop the acceptance stack
        if: always()
        run: |
          if test -f .runtime/autonomy/server.env; then
            docker compose \
              --project-name workchord-server \
              --env-file .runtime/autonomy/server.env \
              -f docker-compose.yml \
              -f docker-compose.server.yml \
              --profile autonomy \
              down
          fi

name: Client and scenario baseline

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      android_release_qualification:
        description: Run the owned ARM64 emulator release qualification
        type: boolean
        default: false
      qualification_inputs:
        description: Absolute path to the provisioned owned fixture input manifest
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: client-baseline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  delivery:
    name: Browser (${{ matrix.access }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - access: trusted-local
            browser_args: ""
          - access: managed
            browser_args: "--managed-browser"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Reserve cleanup and artifact time
        env:
          JOB_BUDGET_MINUTES: "15"
        run: |
          python3 - <<'PYTHON'
          import os
          import time
          deadline = time.time() + int(os.environ["JOB_BUDGET_MINUTES"]) * 60 - 180
          with open(os.environ["GITHUB_ENV"], "a") as output:
              output.write(f"WORKCHORD_CI_DEADLINE_EPOCH={deadline}\n")
          PYTHON
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12.13'
          cache: pip
          cache-dependency-path: |
            backend/build-requirements.lock
            backend/requirements.lock
            backend/test-requirements.lock
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: '22.23.1'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend and browser dependencies
        timeout-minutes: 5
        run: |
          python -m venv "$RUNNER_TEMP/workchord-python"
          "$RUNNER_TEMP/workchord-python/bin/pip" install --require-hashes -r backend/build-requirements.lock
          "$RUNNER_TEMP/workchord-python/bin/pip" install --require-hashes -r backend/requirements.lock
          "$RUNNER_TEMP/workchord-python/bin/pip" install --require-hashes -r backend/test-requirements.lock
          "$RUNNER_TEMP/workchord-python/bin/pip" install --no-build-isolation --no-deps -e ./backend
          sudo python3 scripts/ci/apt_runtime.py
          npx --yes playwright@1.59.1 install-deps chromium
      - name: Run the pinned native runtimes
        run: '"$RUNNER_TEMP/workchord-python/bin/python" scripts/ci/run_disposable_checks.py --browser-only --timeout-seconds 600 ${{ matrix.browser_args }} --output /tmp/workchord-client-results'
      - name: Upload commands, revision, JUnit and browser readback
        timeout-minutes: 2
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: client-baseline-${{ matrix.access }}-${{ github.sha }}
          path: /tmp/workchord-client-results
          if-no-files-found: error
          retention-days: 14

  android-release-qualification:
    if: github.event_name == 'workflow_dispatch' && inputs.android_release_qualification
    runs-on: [self-hosted, ARM64, workchord-android-disposable]
    timeout-minutes: 35
    steps:
      - name: Reserve cleanup and artifact time
        run: |
          python3 - <<'PYTHON'
          import os, time
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f"WORKCHORD_CI_DEADLINE_EPOCH={time.time() + 32 * 60}\n")
          PYTHON
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Qualify the explicitly owned release artifact
        env:
          QUALIFICATION_INPUTS: ${{ inputs.qualification_inputs }}
          WORKCHORD_ANDROID_QUALIFICATION_OWNER: ${{ secrets.ANDROID_QUALIFICATION_OWNER }}
        run: |
          python3 scripts/ci/run_android_checks.py --release-qualification \
            --qualification-inputs "$QUALIFICATION_INPUTS" --timeout-seconds 1800 \
            --output "$RUNNER_TEMP/workchord-android-release-$GITHUB_RUN_ID"
      - name: Upload owned artifact identity and executed scenario receipts
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: android-release-qualification-${{ github.sha }}
          path: ${{ runner.temp }}/workchord-android-release-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 14

  android:
    name: Android unit results and debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Reserve cleanup and artifact time
        env:
          JOB_BUDGET_MINUTES: "25"
        run: |
          python3 - <<'PYTHON'
          import os
          import time
          deadline = time.time() + int(os.environ["JOB_BUDGET_MINUTES"]) * 60 - 180
          with open(os.environ["GITHUB_ENV"], "a") as output:
              output.write(f"WORKCHORD_CI_DEADLINE_EPOCH={deadline}\n")
          PYTHON
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17.0.16+8'
          cache: gradle
          cache-dependency-path: |
            android-companion/gradle/libs.versions.toml
            android-companion/gradle/wrapper/gradle-wrapper.properties
            android-companion/**/*.gradle.kts
      - name: Install the Android SDK components
        timeout-minutes: 5
        run: |
          if ! test -x "$ANDROID_HOME/cmdline-tools/12.0/bin/sdkmanager"; then
            curl --fail --location --retry 3 \
              https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
              -o "$RUNNER_TEMP/workchord-android-tools.zip"
            printf '%s  %s\n' d313adb7aedccf6cf0cfca51ec180f0059f5f8f8 "$RUNNER_TEMP/workchord-android-tools.zip" | sha1sum -c -
            unzip -q "$RUNNER_TEMP/workchord-android-tools.zip" -d "$RUNNER_TEMP/workchord-android-tools"
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            mv "$RUNNER_TEMP/workchord-android-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/12.0"
          fi
          python3 - <<'PY'
          import os
          import subprocess
          from pathlib import Path
          manager = str(Path(os.environ["ANDROID_HOME"]) / "cmdline-tools/12.0/bin/sdkmanager")
          subprocess.run([manager, "--licenses"], input="y\n" * 100, text=True,
                         stdout=subprocess.DEVNULL, check=True, timeout=120)
          subprocess.run([manager, "platforms;android-34", "build-tools;34.0.0"], check=True, timeout=180)
          PY
      - name: Build and execute with the pinned native JDK and SDK
        run: python3 scripts/ci/run_android_checks.py --timeout-seconds 1200 --output /tmp/workchord-android-results
      - name: Upload actual results and debug APK
        timeout-minutes: 2
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: android-baseline-${{ github.sha }}
          path: /tmp/workchord-android-results
          if-no-files-found: error
          retention-days: 14

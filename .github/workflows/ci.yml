name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packaging:
    name: Packaging and contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12.13'
          cache: pip
          cache-dependency-path: |
            backend/build-requirements.lock
            backend/requirements.lock
            backend/test-requirements.lock
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: '22.23.1'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Set up native PostgreSQL
        timeout-minutes: 3
        uses: ./.github/actions/native-postgres
      - name: Create the project environment
        run: python -m venv .venv
      - name: Install the backend
        timeout-minutes: 5
        run: |
          .venv/bin/pip install --require-hashes -r backend/build-requirements.lock
          .venv/bin/pip install --require-hashes -r backend/requirements.lock
          .venv/bin/pip install --require-hashes -r backend/test-requirements.lock
          .venv/bin/pip install --no-build-isolation --no-deps -e ./backend
      - name: Validate native runtime helpers
        timeout-minutes: 3
        run: .venv/bin/python -m unittest discover -s scripts/ci/tests -v
      - name: Validate the backend wheel boundary
        timeout-minutes: 10
        run: |
          wheel_dir="$(mktemp -d)"
          .venv/bin/pip wheel --no-build-isolation --no-deps --wheel-dir "$wheel_dir" ./backend
          .venv/bin/python - "$wheel_dir" backend/app/migrations <<'PY'
          from pathlib import Path
          from sys import argv
          from zipfile import ZipFile

          wheels = sorted(Path(argv[1]).glob("*.whl"))
          if len(wheels) != 1:
              raise SystemExit(f"Expected one backend wheel, found: {wheels}")

          with ZipFile(wheels[0]) as archive:
              members = set(archive.namelist())

          required = {
              "app/__init__.py",
              "app/build_identity.py",
              "app/main.py",
              "app/mcp_server.py",
              "app/cli/worker.py",
              "app/cli/cutover.py",
              "app/cli/closeout.py",
              "app/cli/server_acceptance.py",
              "app/autonomy/server_acceptance.py",
              "app/database_migration/cutover.py",
              "app/database_migration/closeout.py",
              "app/database_migration/postgresql-cutover-execution-v1.schema.json",
              "app/database_migration/postgresql-postcutover-publication-input-v1.schema.json",
              "app/database_migration/postgresql-closeout-observations-v1.schema.json",
              "app/autonomy/contracts/postgresql/contract-manifest-v1.json",
              "app/autonomy/contracts/postgresql/autonomous-dag-v1.json",
              "app/autonomy/contracts/postgresql/status-rules-v1.json",
              "app/autonomy/contracts/postgresql/postgresql-capacity-contract-v1.json",
              "app/autonomy/contracts/postgresql/postgresql-data-lifecycle-policy-v1.json",
              "app/autonomy/contracts/postgresql/postgresql-load-result-v1.schema.json",
              "app/autonomy/contracts/postgresql/postgresql-precutover-qualification-v1.schema.json",
              "app/autonomy/contracts/postgresql/postgresql-resilience-observations-v1.schema.json",
              "app/config/scheduling_rules.yaml",
          }
          source_migrations = Path(argv[2])
          required_migrations = {
              f"app/migrations/{path.relative_to(source_migrations).as_posix()}"
              for path in source_migrations.rglob("*")
              if path.is_file() and "__pycache__" not in path.parts
          }
          required.update(required_migrations)
          missing = sorted(required - members)
          if missing:
              raise SystemExit(f"Missing backend wheel members: {missing}")

          unexpected = sorted(
              name
              for name in members
              if (
                  name.startswith("alembic/")
                  or name == "alembic.ini"
                  or "__pycache__/" in name
                  or name.endswith(".pyc")
              )
          )
          if unexpected:
              raise SystemExit(
                  f"Top-level Alembic resources unexpectedly included: {unexpected}"
              )
          PY
          wheel="$(find "$wheel_dir" -maxdepth 1 -name '*.whl' -print -quit)"
          installed_wheel_venv="$(mktemp -d)"
          python -m venv "$installed_wheel_venv"
          "$installed_wheel_venv/bin/pip" install --require-hashes -r backend/requirements.lock
          "$installed_wheel_venv/bin/pip" install --no-deps "$wheel"
          (
            cd "$(mktemp -d)"
            export DATABASE_URL="sqlite+aiosqlite:///./workchord.db"
            "$installed_wheel_venv/bin/python" - <<'PY'
          from app.main import app
          from app.autonomy.contracts.postgresql import load_postgresql_contract_bundle
          from app.services.upgrade_service import head_revision, run_alembic_upgrade

          assert app.title == "WorkChord API"
          bundle = load_postgresql_contract_bundle()
          assert len(bundle.members) == 7
          assert bundle.archive_verified is False
          assert bundle.blocker_codes == ("immutable-contract-archive-unavailable",)
          before, _, after = run_alembic_upgrade(backup=False, run_repairs=False)
          assert before.state == "empty"
          assert after.is_current
          assert after.current_revision == head_revision()
          PY
            "$installed_wheel_venv/bin/workchord-mcp" --help >/dev/null
            "$installed_wheel_venv/bin/workchord-worker" --help >/dev/null
            "$installed_wheel_venv/bin/workchord-db-migrate" --help >/dev/null
            "$installed_wheel_venv/bin/workchord-db-cutover" --help >/dev/null
            "$installed_wheel_venv/bin/workchord-db-closeout" --help >/dev/null
            "$installed_wheel_venv/bin/workchord-agent-preflight" --help >/dev/null
            "$installed_wheel_venv/bin/workchord-server-acceptance" --help >/dev/null
          )
          "$installed_wheel_venv/bin/python" \
            scripts/ci/installed_wheel_postgresql_qualification.py \
            --admin-url "$POSTGRES_ADMIN_URL"
      - name: Validate Python source and migrations
        timeout-minutes: 3
        run: |
          PYTHONPYCACHEPREFIX=/tmp/workchord-pycache .venv/bin/python -m compileall -q backend/app scripts
          (cd backend && PYTHONPYCACHEPREFIX=/tmp/workchord-pycache ../.venv/bin/alembic -c app/migrations/alembic.ini heads)
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=backend .venv/bin/python -c "from app.main import app; assert app.title == 'WorkChord API'; assert app.version == '1.7.0'"
          .venv/bin/python scripts/generate_client_contract.py --check
          .venv/bin/python scripts/generate_agent_team_contract.py --output /tmp/agent-team-master-v1.schema.json
          .venv/bin/python scripts/generate_agent_team_report_contract.py --output /tmp/agent-team-setup-report-v1.schema.json
      - name: Validate the PostgreSQL qualification harness contract
        timeout-minutes: 3
        run: |
          qualification_dir="$(mktemp -d)"
          PYTHONPATH=backend .venv/bin/python scripts/load/seed.py \
            --profile full \
            --dry-run \
            --manifest "$qualification_dir/full-seed-plan.json"
          for profile in human_peak_v1 mixed_peak_v1 connection_surge_v1 external_llm_wait_v1; do
            PYTHONPATH=backend .venv/bin/python scripts/load/run.py \
              --profile "$profile" \
              --phase dry \
              --base-url http://127.0.0.1:8001 \
              --authorize-host 127.0.0.1:8001 \
              --environment test \
              --output "$qualification_dir/$profile-dry.json"
          done
          cp -R "$qualification_dir" /tmp/workchord-qualification-contracts
          PYTHONPATH=backend .venv/bin/python \
            scripts/ci/check_model_aware_routing_closeout.py \
            --require-tracked \
            --output /tmp/workchord-qualification-contracts/model-aware-routing-closeout.json
      - name: Validate PostgreSQL operator documentation
        timeout-minutes: 2
        run: |
          .venv/bin/python scripts/ci/check_postgresql_documentation.py
      - name: Upload the qualification harness contracts
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: workchord-qualification-contracts
          path: /tmp/workchord-qualification-contracts
          if-no-files-found: error
          retention-days: 14
      - name: Validate agent role packages
        timeout-minutes: 3
        run: |
          .venv/bin/python scripts/build_agent_skills.py validate
          .venv/bin/python scripts/build_agent_skills.py build --output-dir /tmp/workchord-agent-skills
          .venv/bin/python scripts/build_agent_skills.py build-codex-plugin --output-dir /tmp/workchord-codex-plugin
          diff -ru adapters/codex/workchord-agent-roles /tmp/workchord-codex-plugin
      - name: Validate the local Compose profile
        timeout-minutes: 2
        env:
          WORKCHORD_SOURCE_REVISION: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          WORKCHORD_ACCEPTANCE_REPORT_DIR: /tmp/workchord-server-acceptance
          OPENBAO_DEV_ROOT_TOKEN: workchord-ci-openbao-only
          MINIO_ROOT_USER: workchordci
          MINIO_ROOT_PASSWORD: workchord-ci-minio-only
          AUTONOMY_MINIO_ACCESS_KEY: workchordciaccept
          AUTONOMY_MINIO_SECRET_KEY: workchord-ci-accept-only
          POSTGRES_PASSWORD: workchord-ci-postgres-only
          WORKCHORD_MIGRATOR_PASSWORD: workchord-ci-migrator-only
          WORKCHORD_RUNTIME_PASSWORD: workchord-ci-runtime-only
          WORKCHORD_BACKUP_PASSWORD: workchord-ci-backup-only
          DATABASE_MIGRATION_URL: postgresql+psycopg://workchord_migrator:workchord-ci-migrator-only@postgres:5432/workchord
          DATABASE_RUNTIME_URL: postgresql+psycopg://workchord_runtime:workchord-ci-runtime-only@postgres:5432/workchord
        run: |
          docker compose config --quiet
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.server.yml \
            --profile autonomy \
            config --quiet
      - name: Stop the job-owned PostgreSQL cluster
        timeout-minutes: 1
        if: always()
        run: >-
          python3 scripts/ci/postgres_runtime.py stop
          --bin-dir /usr/lib/postgresql/18/bin
          --data-dir "$RUNNER_TEMP/workchord-postgresql"

  backend:
    name: Backend (${{ matrix.scope }})
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.job_minutes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - scope: sqlite
            job_minutes: 25
            work_seconds: 1200
          - scope: postgresql
            job_minutes: 20
            work_seconds: 900
    steps:
      - name: Reserve cleanup and artifact time
        env:
          JOB_BUDGET_MINUTES: "${{ matrix.job_minutes }}"
        run: |
          python3 - <<'PYTHON'
          import os
          import time
          deadline = time.time() + int(os.environ["JOB_BUDGET_MINUTES"]) * 60 - 180
          with open(os.environ["GITHUB_ENV"], "a") as output:
              output.write(f"WORKCHORD_CI_DEADLINE_EPOCH={deadline}\n")
          PYTHON
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12.13'
          cache: pip
          cache-dependency-path: |
            backend/build-requirements.lock
            backend/requirements.lock
            backend/test-requirements.lock
      - name: Set up native PostgreSQL
        timeout-minutes: 3
        if: matrix.scope == 'postgresql'
        uses: ./.github/actions/native-postgres
      - name: Install the backend
        timeout-minutes: 5
        run: |
          python -m venv .venv
          .venv/bin/pip install --require-hashes -r backend/build-requirements.lock
          .venv/bin/pip install --require-hashes -r backend/requirements.lock
          .venv/bin/pip install --require-hashes -r backend/test-requirements.lock
          .venv/bin/pip install --no-build-isolation --no-deps -e ./backend
      - name: Run the selected database suite
        run: >-
          .venv/bin/python scripts/ci/run_disposable_checks.py
          --scope ${{ matrix.scope }} --timeout-seconds ${{ matrix.work_seconds }}
          --output /tmp/workchord-backend-results
      - name: Upload database results and durations
        if: always()
        timeout-minutes: 2
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: backend-${{ matrix.scope }}-${{ github.sha }}
          path: /tmp/workchord-backend-results
          if-no-files-found: error
          retention-days: 14
      - name: Stop the job-owned PostgreSQL cluster
        if: always() && matrix.scope == 'postgresql'
        timeout-minutes: 1
        run: >-
          python3 scripts/ci/postgres_runtime.py stop
          --bin-dir /usr/lib/postgresql/18/bin
          --data-dir "$RUNNER_TEMP/workchord-postgresql"

  frontend:
    name: Frontend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Reserve cleanup and artifact time
        env:
          JOB_BUDGET_MINUTES: "15"
        run: |
          python3 - <<'PYTHON'
          import os
          import time
          deadline = time.time() + int(os.environ["JOB_BUDGET_MINUTES"]) * 60 - 180
          with open(os.environ["GITHUB_ENV"], "a") as output:
              output.write(f"WORKCHORD_CI_DEADLINE_EPOCH={deadline}\n")
          PYTHON
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12.13'
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: '22.23.1'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Run frontend checks
        run: >-
          python scripts/ci/run_disposable_checks.py --scope frontend
          --timeout-seconds 600 --output /tmp/workchord-frontend-results
      - name: Upload frontend results and durations
        if: always()
        timeout-minutes: 2
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: frontend-${{ github.sha }}
          path: /tmp/workchord-frontend-results
          if-no-files-found: error
          retention-days: 14

  clients:
    name: Browser and Android checks
    uses: ./.github/workflows/client-baseline.yml

  build:
    name: Source and build checks
    if: always()
    needs: [packaging, backend, frontend, clients]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every check to finish successfully
        env:
          CHECK_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          results = json.loads(os.environ["CHECK_RESULTS"])
          expected = {"packaging", "backend", "frontend", "clients"}
          if set(results) != expected:
              raise SystemExit("Required check inventory differs")
          failed = {name: value["result"] for name, value in results.items() if value["result"] != "success"}
          if failed:
              raise SystemExit(f"Required checks did not succeed: {failed}")
          print("All required checks completed successfully")
          PYTHON

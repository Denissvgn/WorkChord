name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Source and build checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.4-bookworm@sha256:1961f96e6029a02c3812d7cb329a3b03a3ac2bb067058dec17b0f5596aca9296
        env:
          POSTGRES_PASSWORD: workchord-ci-only
          POSTGRES_INITDB_ARGS: --locale-provider=builtin --builtin-locale=PG_UNICODE_FAST
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12.13'
          cache: pip
          cache-dependency-path: |
            backend/build-requirements.lock
            backend/requirements.lock
            backend/test-requirements.lock
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: '22.23.1'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Create the project environment
        run: python -m venv .venv
      - name: Install the backend
        run: |
          .venv/bin/pip install --require-hashes -r backend/build-requirements.lock
          .venv/bin/pip install --require-hashes -r backend/requirements.lock
          .venv/bin/pip install --require-hashes -r backend/test-requirements.lock
          .venv/bin/pip install --no-build-isolation --no-deps -e ./backend
      - name: Run the backend database harness
        env:
          DEPLOYMENT_ENVIRONMENT: test
          DATABASE_SSL_MODE: disable
          POSTGRES_ADMIN_URL: postgresql+psycopg://postgres:workchord-ci-only@127.0.0.1:5432/postgres
          WORKCHORD_SCHEMA_DIFF_ARTIFACT: /tmp/workchord-schema-diff.json
        run: |
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=backend .venv/bin/python -m pytest -q -m "not postgresql" backend/tests
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=backend .venv/bin/python -m pytest -q -m postgresql backend/tests
          test -s "$WORKCHORD_SCHEMA_DIFF_ARTIFACT"
      - name: Upload the dual-dialect schema diff
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: workchord-schema-diff
          path: /tmp/workchord-schema-diff.json
          if-no-files-found: error
          retention-days: 14
      - name: Validate the backend wheel boundary
        run: |
          wheel_dir="$(mktemp -d)"
          .venv/bin/pip wheel --no-build-isolation --no-deps --wheel-dir "$wheel_dir" ./backend
          .venv/bin/python - "$wheel_dir" backend/app/migrations <<'PY'
          from pathlib import Path
          from sys import argv
          from zipfile import ZipFile

          wheels = sorted(Path(argv[1]).glob("*.whl"))
          if len(wheels) != 1:
              raise SystemExit(f"Expected one backend wheel, found: {wheels}")

          with ZipFile(wheels[0]) as archive:
              members = set(archive.namelist())

          required = {
              "app/__init__.py",
              "app/main.py",
              "app/mcp_server.py",
              "app/config/scheduling_rules.yaml",
          }
          source_migrations = Path(argv[2])
          required_migrations = {
              f"app/migrations/{path.relative_to(source_migrations).as_posix()}"
              for path in source_migrations.rglob("*")
              if path.is_file() and "__pycache__" not in path.parts
          }
          required.update(required_migrations)
          missing = sorted(required - members)
          if missing:
              raise SystemExit(f"Missing backend wheel members: {missing}")

          unexpected = sorted(
              name
              for name in members
              if (
                  name.startswith("alembic/")
                  or name == "alembic.ini"
                  or "__pycache__/" in name
                  or name.endswith(".pyc")
              )
          )
          if unexpected:
              raise SystemExit(
                  f"Top-level Alembic resources unexpectedly included: {unexpected}"
              )
          PY
          wheel="$(find "$wheel_dir" -maxdepth 1 -name '*.whl' -print -quit)"
          installed_wheel_venv="$(mktemp -d)"
          python -m venv "$installed_wheel_venv"
          "$installed_wheel_venv/bin/pip" install --require-hashes -r backend/requirements.lock
          "$installed_wheel_venv/bin/pip" install --no-deps "$wheel"
          (
            cd "$(mktemp -d)"
            export DATABASE_URL="sqlite+aiosqlite:///./workchord.db"
            "$installed_wheel_venv/bin/python" - <<'PY'
          from app.main import app
          from app.services.upgrade_service import head_revision, run_alembic_upgrade

          assert app.title == "WorkChord API"
          before, _, after = run_alembic_upgrade(backup=False, run_repairs=False)
          assert before.state == "empty"
          assert after.is_current
          assert after.current_revision == head_revision()
          PY
            "$installed_wheel_venv/bin/workchord-mcp" --help >/dev/null
          )
          (
            cd "$(mktemp -d)"
            export DEPLOYMENT_ENVIRONMENT=test
            export DATABASE_SSL_MODE=disable
            export POSTGRES_ADMIN_URL="postgresql+psycopg://postgres:workchord-ci-only@127.0.0.1:5432/postgres"
            "$installed_wheel_venv/bin/python" - <<'PY'
          import asyncio
          import os
          from secrets import token_hex

          import psycopg
          from psycopg import sql
          from sqlalchemy import create_engine, text

          admin_url = os.environ["POSTGRES_ADMIN_URL"]
          admin_psycopg_url = admin_url.replace("postgresql+psycopg://", "postgresql://", 1)
          database_name = f"workchord_test_{token_hex(16)}"
          target_url = admin_url.rsplit("/", 1)[0] + f"/{database_name}"
          with psycopg.connect(admin_psycopg_url, autocommit=True) as connection:
              connection.execute(
                  sql.SQL(
                      "CREATE DATABASE {} TEMPLATE template0 ENCODING 'UTF8' "
                      "LOCALE_PROVIDER builtin BUILTIN_LOCALE 'PG_UNICODE_FAST'"
                  ).format(sql.Identifier(database_name))
              )
          try:
              target_psycopg_url = target_url.replace(
                  "postgresql+psycopg://", "postgresql://", 1
              )
              with psycopg.connect(target_psycopg_url, autocommit=True) as connection:
                  connection.execute("CREATE SCHEMA workchord")
                  connection.execute("REVOKE CREATE ON SCHEMA public FROM PUBLIC")
                  connection.execute(
                      sql.SQL("ALTER DATABASE {} SET timezone TO 'UTC'").format(
                          sql.Identifier(database_name)
                      )
                  )
                  connection.execute(
                      sql.SQL(
                          "ALTER DATABASE {} SET search_path TO workchord, pg_catalog"
                      ).format(sql.Identifier(database_name))
                  )

              os.environ["DATABASE_URL"] = target_url
              from app.config import get_settings
              get_settings.cache_clear()
              from app.database import close_database, engine as async_engine
              from app.database_config import parse_database_configuration
              from app.services.upgrade_service import bootstrap_database_schema

              before, _, after = bootstrap_database_schema()
              assert before.state == "empty"
              assert after.is_current

              configuration = parse_database_configuration(get_settings())
              sync_engine = create_engine(
                  configuration.sync_url,
                  connect_args=dict(configuration.connect_args),
              )
              try:
                  with sync_engine.connect() as connection:
                      assert connection.execute(text("SELECT 1")).scalar_one() == 1
              finally:
                  sync_engine.dispose()

              async def async_smoke() -> None:
                  async with async_engine.connect() as connection:
                      assert (await connection.execute(text("SELECT 1"))).scalar_one() == 1
                  await close_database()

              asyncio.run(async_smoke())
          finally:
              with psycopg.connect(admin_psycopg_url, autocommit=True) as connection:
                  connection.execute(
                      sql.SQL("DROP DATABASE IF EXISTS {} WITH (FORCE)").format(
                          sql.Identifier(database_name)
                      )
                  )
          PY
          )
      - name: Validate Python source and migrations
        run: |
          PYTHONPYCACHEPREFIX=/tmp/workchord-pycache .venv/bin/python -m compileall -q backend/app scripts
          (cd backend && PYTHONPYCACHEPREFIX=/tmp/workchord-pycache ../.venv/bin/alembic -c app/migrations/alembic.ini heads)
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=backend .venv/bin/python -c "from app.main import app; assert app.title == 'WorkChord API'; assert app.version == '1.6.2'"
      - name: Validate agent role packages
        run: |
          .venv/bin/python scripts/build_agent_skills.py validate
          .venv/bin/python scripts/build_agent_skills.py build --output-dir /tmp/workchord-agent-skills
          .venv/bin/python scripts/build_agent_skills.py build-codex-plugin --output-dir /tmp/workchord-codex-plugin
          diff -ru adapters/codex/workchord-agent-roles /tmp/workchord-codex-plugin
      - name: Install and validate the frontend
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build
      - name: Validate the local Compose profile
        run: docker compose config --quiet
